name: counter
publish_to: none
environment:
  sdk: '>=3.11.0 <4.0.0'
workspace:
  - apps/counter_app
  - packages/core_domain
  - packages/core_runtime
  - packages/feature_analytics
  - packages/feature_counting
  - packages/feature_insight
  - packages/feature_usage
  - packages/feature_control_panel
  - packages/feature_monitor
  - packages/feature_onboarding
  - packages/feature_pip
  - packages/shared_l10n
dev_dependencies:
  melos: ^8.8.0


# Vendored copy of firebase_core with the "windows" plugin platform stripped, so
# `flutter build windows` never tries to download/link the Firebase C++ SDK.
# See third_party/firebase_core/README.md.
dependency_overrides:
  cli_util: ^0.6.0 # melos required higher version, but flutter_launcher_icons like 0.4.1 , so we lock at higher version
  firebase_core:
    path: third_party/firebase_core

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

  # MOVE YOUR SCRIPTS INSIDE HERE
  scripts:
    get:
      run: melos exec -- flutter pub get

    clean:
      run: melos exec -- flutter clean

    build:
      run: melos exec --depends-on="build_runner" -- "dart run build_runner build --delete-conflicting-outputs || (dart run build_runner clean && dart run build_runner build --delete-conflicting-outputs)"
      description: Build generated files and retry once with a clean asset graph if build_runner state is stale.

    build:clean:
      run: melos exec -c 1 --depends-on="build_runner" -- "dart run build_runner clean && dart run build_runner build --delete-conflicting-outputs"
      description: Clean build_runner state in each package, then rebuild generated files.

    watch:
      run: melos exec --depends-on="build_runner" -- "dart run build_runner watch --delete-conflicting-outputs"

    analyze:
      run: melos exec -- flutter analyze

    test:
      run: melos exec -- flutter test

    upgrade:
      run: melos exec -- "flutter pub upgrade"
      description: Upgrade dependencies in all packages.