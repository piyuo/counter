plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
println "Keystore path: " + keystorePropertiesFile.absolutePath

android {
    println "compileSdk = ${flutter.compileSdkVersion}"
    println "targetSdk = ${flutter.targetSdkVersion}"

    namespace = "com.piyuo.counter"
    compileSdk 36 // Android 16 (API level 36)
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        ndk {
            // Include ONLY 64-bit ARM architecture
            abiFilters "arm64-v8a"
        }
        applicationId = "com.piyuo.counter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion 24 //flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // versionCode = flutter.versionCode
        // Look for the custom property from Fastlane; fallback to 1 if not provided
        versionCode project.hasProperty('globalVersionCode') ? project.property('globalVersionCode').toInteger() : 1
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystoreProperties.getProperty('storeFile') != null) {
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Signing with the release keys configuration.
            signingConfig signingConfigs.release // <-- 讓 release build 使用上面的簽署設定
            // 其他 release 設定，例如 ProGuard/R8
            minifyEnabled true  // 啟用程式碼壓縮/混淆
            shrinkResources true // 移除未使用的資源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            //signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    jvmToolchain(17)
}

flutter {
    source = "../.."
}