name: counter_app
description: "Piyuo Counter"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.0
# Build number is managed by Fastlane during releases via .build_number file
# to ensure consistent build numbers across all platforms (Android, iOS, macOS).
#
resolution: workspace

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  shared_l10n: any
  core_domain: any
  core_runtime: any
  feature_monitor: any
  feature_onboarding: any
  feature_control_panel: any
  feature_pip: any
  flutter:
      sdk: flutter
  flutter_localizations:
      sdk: flutter
  flutter_vision:
    path: ../../../flutter-vision
  flutter_appkit:
    git:
      url: https://github.com/piyuo/flutter-appkit.git
      ref: v3.2.0
  universal_platform: ^1.1.0
  nested: ^1.0.0
  path: ^1.9.0
  protobuf: ^4.1.1
  provider: ^6.1.2
  beamer: ^1.6.1
  reactive_forms: ^18.1.1
  calendar_date_picker2: ^2.0.1
  badges: ^3.1.2
  cross_file: ^0.3.4+2
  auto_animated: ^3.2.0
  sliding_up_panel: ^2.0.0+1
  path_provider: ^2.1.5
  camera: ^0.11.1
  camera_macos: ^0.0.9
  camera_windows: ^0.2.6+4
  uuid: ^4.5.1
  intl: ^0.20.2
  wakelock_plus: ^1.2.10
  sensors_plus: ^6.1.1
  package_info_plus: ^8.2.1
  flutter_colorpicker: ^1.1.0
  fl_chart: ^1.0.0
  image_picker: ^1.1.2
  input_quantity: ^2.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.5
  url_launcher: ^6.3.1
  universal_io: ^2.2.2
  permission_handler: ^12.0.1
  flutter_riverpod: ^3.2.0
  riverpod_annotation: ^4.0.1
  toastification: ^3.0.3
  go_router: ^17.1.0
  liquid_glass_widgets: ^0.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3
  flutter_lints: ^6.0.0
  analyzer: ^9.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  drift_dev: ^2.25.2
  msix: ^3.16.8
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  rename_app: ^1.6.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
      - assets/icon/
      - assets/images/
      - .env # support sentry

flutter_native_splash:
  color: "#181743"
  image: "assets/images/background.jpg"
  ios_content_mode: scaleAspectFill
  android_12:
   image: "assets/images/background.jpg"

msix_config:
  identity_name: ChienChihLiu.PiyuoCounter
  publisher: CN=4E0B764E-190D-4BDE-B39C-9A76760C7B84
  publisher_display_name: Chien Chih Liu
  msix_version: 1.0.5.0
  display_name: Piyuo Counter
  logo_path: assets/icon/icon.png
  capabilities: internetClient, webcam
  store: true