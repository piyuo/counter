name: counter_app
description: "Piyuo Counter"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.5.2
# Build number is managed by Fastlane during releases via .build_number file
# to ensure consistent build numbers across all platforms (Android, iOS, macOS).
#
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  shared_l10n: any
  core_domain: any
  core_runtime: any
  feature_monitor: any
  feature_onboarding: any
  feature_control_panel: any
  feature_pip: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_vision:
    path: ../../../flutter-vision
  flutter_appkit:
    git:
      url: https://github.com/piyuo/flutter-appkit.git
      ref: v3.8.1
  universal_platform: ^1.1.0
  path: ^1.9.0
  protobuf: ^6.0.0
  sliding_up_panel: ^2.0.0+1
  path_provider: ^2.1.6
  camera: ^0.12.0+2
  camera_macos: ^0.1.0
  camera_windows: ^0.2.6+4
  uuid: ^4.6.0
  intl: ^0.20.2
  sensors_plus: ^7.1.0
  package_info_plus: ^10.2.1
  fl_chart: ^1.2.0
  image_picker: ^1.1.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8
  url_launcher: ^6.3.2
  universal_io: ^2.2.2
  flutter_riverpod: ^3.4.2 # block by analyzer
  riverpod_annotation: ^4.0.6 # block by analyzer
  toastification: ^3.2.0
  go_router: ^18.0.0
  liquid_glass_widgets: ^1.2.3
  shared_preferences_android: 2.4.28
dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  flutter_lints: ^6.0.0
  analyzer: ^13.3.0
  riverpod_generator: ^4.0.8 # block by analyzer
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  drift_dev: ^2.34.5
  msix: ^3.18.0
  flutter_launcher_icons: ^0.14.4

#dependency_overrides:
#  rename_app: ^1.6.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - .env # support sentry
  config:
    enable-lldb-debugging: false

flutter_native_splash:
  color: "#181743"
  image: "assets/images/background.jpg"
  ios_content_mode: scaleAspectFill
  android_12:
    image: "assets/images/background.jpg"

msix_config:
  identity_name: ChienChihLiu.PiyuoCounter
  publisher: CN=4E0B764E-190D-4BDE-B39C-9A76760C7B84
  publisher_display_name: Chien Chih Liu
  display_name: Piyuo Counter
  logo_path: assets/icon/icon.png
  capabilities: internetClient, webcam
  store: true
