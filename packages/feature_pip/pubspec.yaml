name: feature_pip
description: "Picture in picture UI"
version: 1.4.1
resolution: workspace
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  shared_l10n: any
  flutter:
    sdk: flutter
  flutter_appkit:
    git:
      url: https://github.com/piyuo/flutter-appkit.git
      ref: v3.7.0
  liquid_glass_widgets: ^0.29.2
  flutter_riverpod: ^3.3.2 # block by analyzer
  riverpod_annotation: ^4.0.3 # block by analyzer
  universal_platform: ^1.1.0
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  go_router: ^17.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  flutter_lints: ^6.0.0
  analyzer: ^12.1.0
  riverpod_generator: ^4.0.4 # block by analyzer
  build_runner: ^2.15.1

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
