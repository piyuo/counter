name: feature_monitor
description: "The monitor to preview video."
version: 1.5.1
resolution: workspace
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  camera: ^0.12.0+2
  core_domain: any
  flutter:
    sdk: flutter
  flutter_vision:
    path: ../../../flutter-vision
  flutter_appkit:
    git:
      url: https://github.com/piyuo/flutter-appkit.git
      ref: v3.7.0
  flutter_riverpod: ^3.3.2 # block by analyzer
  riverpod_annotation: ^4.0.3 # block by analyzer
  go_router: ^17.4.0
  universal_platform: ^1.1.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.2.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
