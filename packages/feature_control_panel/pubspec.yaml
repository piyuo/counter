name: feature_control_panel
description: "the float window control panel"
version: 1.5.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  core_domain: any
  core_runtime: any
  feature_onboarding: any
  feature_pip: any
  shared_l10n: any
  flutter:
    sdk: flutter
  flutter_vision:
    path: ../../../flutter-vision
  liquid_glass_widgets: ^1.2.3
  flutter_appkit:
    git:
      url: https://github.com/piyuo/flutter-appkit.git
      ref: v3.8.1
  flutter_riverpod: ^3.4.2 # block by analyzer
  riverpod_annotation: ^4.0.6 # block by analyzer
  image_picker: ^1.1.2
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  package_info_plus: ^10.2.1
  path: ^1.9.0
  path_provider: ^2.1.6
  primer_progress_bar: ^0.5.0
  go_router: ^18.0.0
  universal_platform: ^1.1.0
  url_launcher: ^6.2.0
  auto_size_text: ^3.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  analyzer: ^13.3.0
  go_router_builder: ^4.2.1
  riverpod_generator: ^4.0.8 # block by analyzer
  build_runner: ^2.16.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
