version: 1.5.2
resolution: workspace
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.4.2 # block by analyzer
  riverpod_annotation: ^4.0.6 # block by analyzer
  flutter_appkit:
    git:
      url: https://github.com/piyuo/flutter-appkit.git
      ref: v3.8.1
  freezed_annotation: ^3.1.0
  uuid: ^4.6.0
  riverpod: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  flutter_lints: ^6.0.0
  analyzer: ^13.3.0
  riverpod_generator: ^4.0.8 # block by analyzer
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  build_runner: ^2.16.0

flutter:
  uses-material-design: true
